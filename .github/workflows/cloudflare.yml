# Dang web len Cloudflare Pages tu GitHub (project diamonds-speaking).
# Can 1 secret trong kho: CLOUDFLARE_API_TOKEN (quyen Cloudflare Pages: Edit).
# Build (npm run build) roi dang thu muc dist.
# Day len main: dang web that (diamonds-speaking.pages.dev).
# Pull request: dang ban xem thu pr-N.diamonds-speaking.pages.dev, link ghi vao pull request.
name: Cloudflare
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
  pull-requests: write
concurrency:
  group: cf-${{ github.event_name == 'pull_request' && github.event.number || 'main' }}
  cancel-in-progress: false
env:
  CLOUDFLARE_ACCOUNT_ID: a7e6fa93cf0900158371577d4980b8cf
  PROJECT: diamonds-speaking
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build
        env:
          VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN || 'https://99a08f06e355b84fe868360b7d47290a@o4512397147701248.ingest.us.sentry.io/4512397255770112' }}
          VITE_SENTRY_ENVIRONMENT: ${{ github.event_name == 'pull_request' && 'preview' || 'production' }}
          VITE_SENTRY_RELEASE: diamond-ielts-frontend@${{ github.sha }}
          VITE_SENTRY_TRACES_SAMPLE_RATE: '0.1'
        run: |
          npm ci
          npm run build
      - name: Dang len Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then BR="pr-${{ github.event.number }}"; else BR="main"; fi
          # lan dau: tao project neu chua co
          npx -y wrangler@4.20.0 pages project create "$PROJECT" --production-branch=main >/dev/null 2>&1 || true
          npx -y wrangler@4.20.0 pages deploy dist --project-name="$PROJECT" --branch="$BR" --commit-dirty=true
      - name: Ghi link xem thu vao pull request
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const body = "Link xem thử: https://pr-" + context.issue.number + ".diamonds-speaking.pages.dev";
            const {data} = await github.rest.issues.listComments({owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number});
            if (!data.some(c => c.body === body)) await github.rest.issues.createComment({owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body});
