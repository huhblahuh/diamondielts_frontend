# Dang web len Netlify tu GitHub (khong can Netlify vao doc kho).
# Can 2 secret trong kho: NETLIFY_AUTH_TOKEN, NETLIFY_SITE_ID.
# Build (npm run build) roi dang thu muc dist. Day len main: dang web that. Pull request: dang ban xem thu, link ghi vao pull request.
name: Netlify
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
  pull-requests: write
concurrency:
  group: netlify-${{ github.event_name == 'pull_request' && github.event.number || 'main' }}
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build
        env:
          VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN || 'https://99a08f06e355b84fe868360b7d47290a@o4512397147701248.ingest.us.sentry.io/4512397255770112' }}
          VITE_SENTRY_ENVIRONMENT: ${{ github.event_name == 'pull_request' && 'preview' || 'production' }}
          VITE_SENTRY_RELEASE: diamond-ielts-frontend@${{ github.sha }}
          VITE_SENTRY_TRACES_SAMPLE_RATE: '0.1'
        run: |
          npm ci
          npm run build
      - name: Dang len Netlify
        id: nf
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          npm i -g netlify-cli@17 >/dev/null 2>&1
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            netlify deploy --dir=dist --alias=pr-${{ github.event.number }} --json > out.json
          else
            netlify deploy --dir=dist --prod --json > out.json
          fi
          echo "url=$(node -e 'const j=require("./out.json");console.log(j.deploy_url||j.url)')" >> "$GITHUB_OUTPUT"
      - name: Ghi link xem thu vao pull request
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const body = "Link xem thử: ${{ steps.nf.outputs.url }}";
            const {data} = await github.rest.issues.listComments({owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number});
            if (!data.some(c => c.body === body)) await github.rest.issues.createComment({owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body});
